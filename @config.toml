roles = """[บทบาทหน้าที่]
- นักวิจัยอัลกอริทึม / วิศวกรซอฟต์แวร์"""
results = """[ความสำเร็จ / ผลลัพธ์]
- การพัฒนาโมเดลการทำงานร่วมกันระหว่าง DVN และ LLM: ใช้ DVN ในการประเมินมูลค่าอย่างมีประสิทธิภาพและคัดกรองแนวทางแก้ไขที่เหมาะสมโดยอิงจากลักษณะสถานะการทำงานที่ต่อเนื่อง เช่น สถานะเที่ยวบิน การกระจายบุคลากร และกรอบเวลาของงาน เมื่อรวมกับความสามารถในการให้เหตุผลเชิงความหมายของ LLM ทำให้สามารถจัดตารางเวลาอัตโนมัติที่สร้างความสมดุลระหว่างประสิทธิภาพและปฏิบัติตามกฎระเบียบอย่างเคร่งครัด
- AI ที่สามารถอธิบายได้ผ่าน RAG และ CoT: บูรณาการกฎระเบียบการบินพลเรือนของจีน (CCAR), ขั้นตอนการปฏิบัติงานมาตรฐาน (SOP) และกรณีการจัดตารางเวลาในอดีต เพื่อสร้างระบบดึงข้อมูลหน่วยความจำแบบสองชั้นทั้งระยะสั้นและระยะยาว (RAG) นำกระบวนการให้เหตุผลแบบ Chain-of-Thought (CoT) ตามลำดับชั้นมาใช้ เพื่อทำลายข้อจำกัดแบบกล่องดำ (Black-box) ของการเรียนรู้แบบเสริมกำลังแบบดั้งเดิม พร้อมทั้งสร้างผลลัพธ์การจัดสรรงานที่เป็นมาตรฐานควบคู่ไปกับข้อความอธิบายในภาษาธรรมชาติที่ให้รายละเอียดเกี่ยวกับฐานกฎระเบียบและเหตุผลในการเลือกบุคลากร
- การบังคับใช้กฎระเบียบและข้อจำกัดทางธุรกิจอย่างเคร่งครัด: ใช้ความสามารถในการวิเคราะห์ข้อความของ LLM เพื่อบูรณาการข้อจำกัดที่เข้มงวดและซับซ้อน เช่น ขีดจำกัดชั่วโมงการทำงานต่อเนื่อง การจับคู่ทักษะที่ใช้ร่วมกันไม่ได้ และความสัมพันธ์ในการทดแทนที่เข้ากันได้ในระดับต่ำกว่าในลำดับชั้นบทบาทต่างๆ เข้าสู่ระบบ วิธีนี้ช่วยหลีกเลี่ยงการจัดสรรงานที่ไม่เป็นไปตามข้อกำหนดได้อย่างมีประสิทธิภาพและช่วยเพิ่มระดับความปลอดภัย
- การปรับตัวแบบไดนามิกและการตรวจสอบแบบจำลอง: จัดการกับสถานการณ์ที่ไม่ปกติ เช่น เที่ยวบินล่าช้า การเปลี่ยนประตูขึ้นเครื่องชั่วคราว และการขาดแคลนบุคลากรกะทันหัน ผ่านการทดสอบแบบจำลองระบบปิด (Closed-loop simulation) โดยใช้ข้อมูลในอดีตที่แท้จริง ซึ่งช่วยยืนยันความแข็งแกร่งของระบบและความสามารถในการตอบสนองแบบเรียลไทม์ที่มีประสิทธิภาพสูงระหว่างการกำหนดค่างานใหม่ในภาพรวม"""

