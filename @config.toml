I Programmed Industrial Real-Time Process Information Management System (known as PLANETMEISTER) and its Gateway Software. Bug fix included

This project utilized the TCP/IP protocol to receive data from sensors, enabling efficient and reliable processing.

Why TCP/IP was chosen ?.
The data sent by the sensors was critical and could not tolerate any loss or disorder.
Therefore, we prioritized the reliability of data transmission and adopted the TCP protocol to ensure the data was delivered securely. TCP provides retransmission features in case of data loss and maintains the order of transmission, making it the optimal choice for achieving both real-time performance and stability.

In this system, the sensors transmitted data using TCP, and the server-side received it in real-time through TCP sockets. The received data packets were parsed to extract necessary information, such as sensor IDs and measurement values. Additionally, we leveraged Golang’s concurrency features (goroutines and channels) to efficiently handle a large number of connections, ensuring scalability.

Key outcomes are that Achieved a 40% increase in data throughput.
Significantly reduced processing time, ensuring real-time performance.
Enabled a smooth migration from the legacy system built with VB and C languages through reliable data communication.

Through this project, I successfully combined the reliable communication capabilities of the TCP/IP protocol with the high-efficiency concurrency of Golang, resulting in a substantial improvement in overall system performance and stability.

I also programmed control software in C#, enabling system operators to monitor real-time industrial data. In collaboration with a seven-member team, I participated in software specification design, test plan execution, and quality assurance. Furthermore, I created detailed technical documentation, reported project progress, and provided solutions to stakeholders
"""

