[[languages.fil.params.projects]]
title = "Proyekto sa Pag-optimize ng Pagpapadala ng mga Tauhan na may Maraming Kasanayan sa Serbisyo sa Lupa ng China Eastern Airlines"
period = "2024.9 - 2026.6"
overview = """Bumuo ng isang naipapaliwanag na sistema ng pag-iskedyul para sa mga tauhan na may maraming kasanayan sa mga serbisyo sa lupa ng abyasyon, gamit ang isang kolaboratibong balangkas na nakabatay sa Deep Value Network (DVN) at Large Language Model (LLM)."""
roles = """[Tungkulin]
- Mananaliksik ng Algorithm / Inhinyero ng Software"""
results = """[Mga Natamo / Resulta]
- Pag-develop ng DVN-LLM Collaborative Model: Ginamit ang DVN upang mahusay na masuri ang halaga at salain ang mga kandidatong solusyon batay sa patuloy na mga katangian ng pagpapatakbo gaya ng katayuan ng flight, pamamahagi ng tauhan, at mga time window ng gawain. Pinagsama sa kakayahan sa semantikong pangangatwiran ng LLM, nakamit ang awtomatikong pag-iskedyul na nagbabalanse sa kahusayan at mahigpit na pagsunod sa mga panuntunan.
- Maipapaliwanag na AI gamit ang RAG at CoT: Pinagsama ang Chinese Civil Aviation Regulations (CCAR), Standard Operating Procedures (SOP), at mga nakaraang kaso ng pag-iskedyul upang bumuo ng pangmatagalan at panandaliang dual-layer memory retrieval system (RAG). Ipinakilala ang isang hierarchical Chain-of-Thought (CoT) na proseso ng pangangatwiran, na sumisira sa limitasyong black-box ng tradisyonal na reinforcement learning. Sabay na bumuo ng mga pamantayang resulta ng pagpapadala kasama ng mga paliwanag sa natural na wika na nagdedetalye ng mga batayan sa regulasyon at mga dahilan sa pagpili ng tauhan.
- Mahigpit na Pagpapatupad ng mga Panuntunan at Paghihigpit sa Negosyo: Ginamit ang kakayahan ng LLM sa pagsusuri ng teksto upang isama ang mga kumplikado at mahigpit na paghihigpit—tulad ng limitasyon sa tuloy-tuloy na oras ng pagtatrabaho, eksklusibong pagtutugma ng kasanayan, at downward-compatible na mga ugnayan ng pagpapalit sa iba't ibang antas ng tungkulin—sa systema. Epektibong naiwasan ng pamamaraang ito ang mga pagpapadalang labag sa patakaran at pinataas ang mga margin sa kaligtasan.
- Dinamikong Adaptasyon at Pagsusuri ng Simulation: Tinugunan ang mga hindi normal na sitwasyon tulad ng mga pagkaantala ng flight, panandaliang pagbabago ng gate, at biglaang kakulangan sa tauhan sa pamamagitan ng closed-loop simulation testing gamit ang totoong historikal na datos. Pinatunayan nito ang katatagan ng sistema at ang napakahusay na kakayahang tumugon sa real-time sa pangkalahatang muling pag-aayos ng mga gawain."""

