ดังนั้นจึงต้องให้ความสำคัญกับความน่าเชื่อถือของการรับ-ส่งข้อมูลเป็นอันดับแรก
และ TCP protocol มีฟังก์ชันรองรับการส่งซ้ำหากข้อมูลสูญหาย รวมถึงคงลำดับการส่งได้ จึงเหมาะสมอย่างยิ่งสำหรับทั้งความเรียลไทม์และความเสถียร

เซ็นเซอร์จะส่งข้อมูลผ่าน TCP และฝั่งเซิร์ฟเวอร์จะรับข้อมูลแบบเรียลไทม์ผ่าน TCP socket
จากนั้นจะมีการ解析แพ็กเก็ตเพื่อดึงข้อมูลที่ต้องการ เช่น sensor ID และค่าการวัดต่าง ๆ

นอกจากนี้ ผมยังได้ใช้ฟังก์ชัน concurrency ของ Golang (goroutines และ channels)
เพื่อจัดการการเชื่อมต่อจำนวนมากได้อย่างมีประสิทธิภาพ ทำให้ระบบสามารถขยายตัวได้ (scalable)

ผลลัพธ์สำคัญ:
- เพิ่ม throughput ของข้อมูลได้ถึง 40%
- ลดเวลาในการประมวลผลอย่างมีนัยสำคัญ รองรับความต้องการแบบเรียลไทม์
- ย้ายจากระบบเก่า (พัฒนาใน VB และ C) มาเป็นระบบใหม่ได้อย่างราบรื่น ด้วยการสื่อสารข้อมูลที่มีความน่าเชื่อถือ

โปรเจกต์นี้แสดงให้เห็นถึงการผสานกันระหว่างการสื่อสารข้อมูลที่น่าเชื่อถือของ TCP/IP และ concurrency ประสิทธิภาพสูงของ Golang
นำไปสู่การปรับปรุงประสิทธิภาพและความเสถียรของระบบโดยรวมได้อย่างมาก

นอกจากนี้ ผมได้พัฒนา software ควบคุมด้วย C# เพื่อให้ผู้ปฏิบัติงานสามารถมอนิเตอร์ข้อมูลอุตสาหกรรมแบบเรียลไทม์
และร่วมทำงานกับทีม 7 คน ตั้งแต่การออกแบบสเปกซอฟต์แวร์ วางแผนทดสอบ และประกันคุณภาพ
รวมถึงเขียนเอกสารเชิงเทคนิคและรายงานความคืบหน้าแก่ผู้มีส่วนได้ส่วนเสีย
"""
