[[languages.th.params.projects]]
title = "โครงการเพิ่มประสิทธิภาพการจัดตารางเวลาบุคลากรที่มีทักษะหลากหลายสำหรับบริการภาคพื้นดินของสายการบิน China Eastern Airlines"
