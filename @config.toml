[[languages.ja.params.projects]]
title = "中国東方航空 地上サービス・マルチスキル人員派工（スケジューリング）最適化プロジェクト"
period = "2024.9 - 2026.6"
overview = """複雑な航空地上サービスにおいて、深度価値ネットワーク（DVN）と大規模言語モデル（LLM）を協調させたマルチスキル人員の最適化スケジューリングシステムを構築しました。"""
roles = """【役割】
・アルゴリズム研究開発 / ソフトウェアエンジニア"""
results = """【実績・成果】
・DVN-LLM協調モデルの開発：DVNを用いてフライト状況、人員の分布、タスクの時間枠などの連続的な状態特徴を高効率に価値評価し、候補を絞り込みました。これとLLMの意味推論能力を組み合わせることで、最適化の効率とルールの遵守を両立した自動スケジューリングを実現しました。
・RAGとCoTを活用した説明可能なAI：中国民用航空規章（CCAR）、標準作業手順書（SOP）、過去のスケジュール履歴を統合し、長期・短期の双層記憶検索システム（RAG）を構築しました。階層的な思考連鎖（CoT）推論プロセスを導入し、従来の強化学習におけるブラックボックスの限界を打破しました。標準化された派工（タスク割り当て）結果を出力すると同時に、ルール根拠や人員選択の理由を含む自然言語の説明テキストを生成する仕組みを実装しました。
・業務ルールと制約の厳密な適用：LLMのテキスト解析能力を通じて、従業員の連続作業時間の制限、スキル資格の排他マッチング、異なる役割階層の互換（下位代替）関係などの複雑で厳格な制約をシステムに組み込みました。この手法により、コンプライアンス違反による割り当てを効果的に回避し、安全性のマージンを向上させました。
・動的環境への適応とシミュレーション検証：航空機の遅延、搭乗ゲートの急な変更、突発的な人員不足といった異常シナリオに対して、実際の履歴データを用いた閉ループシミュレーションテストを実施し、グローバルなタスク再構築におけるシステムの堅牢性と高効率なリアルタイム応答能力を検証しました。"""

