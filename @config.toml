overview = """针对航空地面服务复杂的时空耦合与法规约束问题，构建了基于深度价值网络（DVN）与大语言模型（LLM）协同的多技能人员可解释调度系统。"""
roles = """【角色】
- 算法研发 / 软件工程师"""
results = """【成果与业绩】
- 研发 DVN-LLM 协同模型：利用 DVN 对航班运行状态、人员分布、任务时窗等连续状态特征进行高效的价值评估与候选方案筛选。结合 LLM 的语义推理能力，实现了兼顾优化效率与规则合规性的自动化调度。
- 基于 RAG 与 CoT 的可解释性决策：整合《中国民用航空规章》（CCAR）、标准操作程序（SOP）及历史排班案例，构建了长短时双层记忆检索体系（RAG）。引入层次化思维链（CoT）推理流程，打破了传统强化学习的黑盒局限。在输出标准化派工结果的同时，同步生成包含规则依据和人员选择理由的自然语言解释文本。
- 严格落实业务规则与约束：通过大模型的文本解析能力，将员工连续作业时长限制、技能资质匹配互斥以及不同角色层级的向下兼容替代关系等复杂硬性约束融入系统中。该方法有效避免了违规派单，提升了安全冗余。
- 动态环境适应与仿真验证：针对航班延误、临时换机位及突发人员短缺等异常场景，通过真实历史数据的闭环仿真测试，验证了系统在全局任务重构中的鲁棒性与高效实时响应能力。"""

